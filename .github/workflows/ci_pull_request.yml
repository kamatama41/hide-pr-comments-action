on:
  pull_request:
jobs:
  test-and-release:
    runs-on: ubuntu-latest
    name: Continuous integration
    steps:
    - uses: actions/checkout@v7
    - name: Check dist is up to date
      run: |
        npm ci
        npm run build
        git diff --exit-code dist
    - name: Comment PR
      run: |
        gh pr comment "${PR_NUMBER}" --body "This message is posted by a human, should not be hidden [pull_request]"
        gh pr comment "${PR_NUMBER}" --body "This message is posted by a bot, should be hidden [pull_request]"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - name: Run action
      id: action
      uses: ./
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        author: github-actions
        message_regex: should be hidden \[pull_request\]$
