on:
  push:
    branches-ignore:
      - 'main'
jobs:
  test-and-release:
    runs-on: ubuntu-latest
    name: Continuous integration
    steps:
      - uses: actions/checkout@v7
      - name: Get PR number
        id: pr_number
        run: echo "pr_number=$(gh pr view --json number -q .number || echo "")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment PR
        run: |
          gh pr comment "${PR_NUMBER}" --body "This message is posted by a human, should not be hidden [push]"
          gh pr comment "${PR_NUMBER}" --body "This message is posted by a bot, should be hidden [push]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr_number.outputs.pr_number }}
      - name: Run action
        id: action
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          author: github-actions
          message_regex: should be hidden \[push\]$
          pr_number: ${{ steps.pr_number.outputs.pr_number }}
